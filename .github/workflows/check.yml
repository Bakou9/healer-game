name: check

# Filet de sécurité du projet : cohérence des spécifications et tests du cœur C#
# (conformité aux combats de référence, équilibrage, données, architecture, interface).
# À chaque envoi sur la branche principale et à chaque demande de fusion.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: npm ci
      - run: npm run check
